    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const filtros = document.querySelectorAll('.filtro li');
        const imagenes = document.querySelectorAll('.galeria li');

        filtros.forEach(filtro => {
            filtro.addEventListener('click', (evento) => {
                evento.preventDefault();

                const categoria = filtro.querySelector('a').dataset.filtro;

                // Filtrar las imágenes
                imagenes.forEach(imagen => {
                    if (categoria === 'todas' || imagen.classList.contains(categoria)) {
                        imagen.style.display = '';
                    } else {
                        imagen.style.display = 'none';
                    }
                });

                // Quitar active de todos los li
                filtros.forEach(item => {
                    item.classList.remove('active');
                });

                // Agregar active al li seleccionado
                filtro.classList.add('active');
            });
        });
    </script>
